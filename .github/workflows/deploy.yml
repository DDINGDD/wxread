name: wxread
run-name: wxread auto-read | ${{ github.event_name }} | ${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # 北京时间每天 01:17；避开整点调度高峰，降低 GitHub Actions 延迟概率
    - cron: '17 1 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      read_num:
        description: '本次阅读次数；留空则使用 Repository Variable READ_NUM'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 358
    environment: AutoRead

    steps:
    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Validate Python files
      run: |
        python -m py_compile main.py config.py push.py log_utils.py

    - name: Run auto-read task
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT: ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ github.event.inputs.read_num || vars.READ_NUM }}
        # 700 次 = 350 分钟。main.py 采用固定 30 秒请求周期，避免网络耗时叠加后撞 6 小时限制。
        MAX_READ_NUM: '700'
      run: |
        python main.py

  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
